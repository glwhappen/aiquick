name: release

# 出「绿色版」portable zip（免安装、解压双击即用）。
# 不做 updater、不配任何签名证书；三平台各自在原生机上构建（Linux 上交叉编 Tauri 不可靠）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不回填 tag 时用，如 0.1.0）"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2022
            triple: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
          - name: macos-aarch64
            os: macos-15
            triple: aarch64-apple-darwin
            platform: macos
            arch: aarch64
          - name: linux-x86_64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file zip

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # macOS 出 .app（拖走即用）；Windows / Linux 出单个可执行文件
      - name: Build (windows / linux)
        if: matrix.platform != 'macos'
        run: pnpm tauri build --no-bundle

      - name: Build (macos .app)
        if: matrix.platform == 'macos'
        run: pnpm tauri build --bundles app

      # Windows：单文件 exe（前端资源已通过 custom-protocol 内嵌，双击即用，不需要 zip）
      - name: Stage single-file exe (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" -replace '^v', '' }
          if (-not $version) { $version = '0.0.0' }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item "src-tauri/target/release/aiquick.exe" "out/aiquick.exe" -Force
          Get-Item "out/aiquick.exe" | Select-Object Name, Length

      # Linux：单文件可执行（现代发行版 glibc 直接跑），另外给一个 AppImage 兜底老环境
      - name: Build AppImage (linux)
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: pnpm tauri build --bundles appimage

      - name: Stage single-file binary + AppImage (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp src-tauri/target/release/aiquick out/aiquick
          chmod +x out/aiquick
          APPIMG=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' 2>/dev/null | head -1 || true)
          if [ -n "${APPIMG:-}" ]; then cp "$APPIMG" out/; fi
          ls -lh out/

      # macOS 的系统限制没办法单文件：打 .app.zip，文件名里写明 .app
      - name: Package .app zip (macos)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION" ]; then VERSION="0.1.0"; fi
          NAME="aiquick-${VERSION}-macos-aarch64.app"
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          echo "app = $APP"
          mkdir -p out
          # .app 里可能没有执行位，复制后补上
          ditto "$APP" "out/$NAME.app"
          chmod +x "out/$NAME.app/Contents/MacOS/"* || true
          (cd out && zip -qry "$NAME.zip" "$NAME.app")
          ls -lh "out/$NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            out/aiquick.exe
            out/aiquick
            out/*.AppImage
            out/*.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            out/aiquick.exe
            out/aiquick
            out/*.AppImage
            out/*.zip
          generate_release_notes: true
          body: |
            「aiquick」绿色版（免安装、解压即用）。

            - **Windows**：下载 `aiquick.exe` 直接双击运行（单文件、免安装；需要系统自带 WebView2，Win11/较新 Win10 已内置）
            - **Linux**：下载 `aiquick` 单文件，`chmod +x` 后直接运行；老发行版可下 `*.AppImage`
            - **macOS**：下载 `aiquick-<版本>-macos-aarch64.app.zip`，解压得到 `aiquick.app`（系统限制没法单文件）

            所有产物都不会安装任何东西、不写 PATH；数据都放在本工具自己的目录（卸载 = 删除目录）。
